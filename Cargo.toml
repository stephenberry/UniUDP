[package]
name = "uniudp"
version = "1.2.1"
edition = "2021"
description = "Unidirectional UDP transport with chunking, redundancy, and Reed-Solomon FEC."
license = "MIT"
repository = "https://github.com/stephenberry/UniUDP"
homepage = "https://github.com/stephenberry/UniUDP"
documentation = "https://docs.rs/uniudp"
readme = "README.md"
keywords = ["udp", "networking", "transport", "fec", "reliability"]
categories = ["network-programming"]
rust-version = "1.96"

[lib]
name = "uniudp"
path = "src/lib.rs"

[features]
default = []
tokio = ["dep:tokio"]

[dependencies]
crc32c = "0.6.8"
getrandom = "0.4"
reed-solomon-engine = "0.2"
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
tokio = { version = "1", features = ["net", "time", "rt", "macros"], optional = true }
zeroize = "1"

[dev-dependencies]
criterion = "0.8"
reed-solomon-engine = "0.2"

[[bench]]
name = "performance"
harness = false
